name: Send reminders

# Wakes the site every five minutes to send any activity reminders that are
# due. GitHub can run scheduled jobs a few minutes late, so reminders can be
# too. Needs repository secrets SITE_URL (e.g. https://portfolio-g818.onrender.com)
# and CRON_SECRET (the same value as the server's CRON_SECRET env var).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Only calls the site; needs nothing from the repository.
permissions: {}

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send due reminders
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Reminders aren't set up (SITE_URL or CRON_SECRET missing)."
            exit 0
          fi
          # A sleeping Render instance can take a minute to wake.
          curl --fail-with-body --silent --show-error --max-time 180 \
            --retry 2 --retry-delay 10 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/push/send"
